name: Build

on:
  push:
    paths:
      - '.github/workflows/compile.yml'
      - 'source/**'
      - 'dedicated/**'
      - 'premake5.lua'
      - 'overrides.lua'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GARRYSMOD_COMMON: RaphaelIT7/garrysmod_common
  GARRYSMOD_COMMON_BRANCH: holylib
  SOURCESDK_MINIMAL: RaphaelIT7/sourcesdk-minimal
  SOURCESDK_MINIMAL_BRANCH: patch-7
  PREMAKE_VERSION: 5.0.0-beta8
  PREMAKE_SHA256: e64ce2ed8778e0098f63674cca61fe33941b5f0c8d9a4afd651152bdea3758ab
  CONFIG: Release

jobs:
  windows:
    name: ${{ matrix.package }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # filesystem_stdio.dll with the client dll patches
          - package: win64_client
            premake_args: '--external-dylib-patches'
            workspace: vs2022_patches
          # dedicated.dll + server filesystem_stdio.dll
          - package: win64_srcds
            premake_args: '--dedicated'
            workspace: vs2022_dedicated
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GARRYSMOD_COMMON }}
          ref: ${{ env.GARRYSMOD_COMMON_BRANCH }}
          path: garrysmod_common

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCESDK_MINIMAL }}
          ref: ${{ env.SOURCESDK_MINIMAL_BRANCH }}
          path: garrysmod_common/sourcesdk-minimal

      - uses: actions/checkout@v4
        with:
          repository: danielga/premake-export-compile-commands
          path: garrysmod_common/premake/premake-export-compile-commands

      # Not linked, but garrysmod_common's generator includes their premake files
      - uses: actions/checkout@v4
        with:
          repository: danielga/detouring
          path: garrysmod_common/detouring
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: danielga/scanning
          path: garrysmod_common/scanning

      - name: Download premake
        shell: pwsh
        run: |
          curl.exe -fsSL "https://github.com/premake/premake-core/releases/download/v${env:PREMAKE_VERSION}/premake-${env:PREMAKE_VERSION}-windows.zip" -o premake.zip
          $hash = (Get-FileHash premake.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:PREMAKE_SHA256) { throw "premake.zip hash mismatch: $hash" }
          tar -xf premake.zip premake5.exe

      - name: Generate project
        run: ./premake5.exe --gmcommon=garrysmod_common ${{ matrix.premake_args }} vs2022

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        working-directory: projects/windows/${{ matrix.workspace }}
        run: msbuild filesystem_stdio.sln /m /p:Configuration=${{ env.CONFIG }} /p:Platform=x64

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: projects/windows/${{ matrix.workspace }}/x86_64/${{ env.CONFIG }}/*.dll
          if-no-files-found: error

  linux:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    # Older toolchain/glibc than ubuntu-latest so the .so files load on common server distros
    container: raphaelit7/gmod-builder:latest_64x
    strategy:
      fail-fast: false
      matrix:
        include:
          # filesystem_stdio.so
          - package: linux64_client
            premake_args: ''
            workspace: gmake
          # dedicated_srv.so + server filesystem_stdio.so
          - package: linux64_srcds
            premake_args: '--dedicated'
            workspace: gmake_dedicated
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GARRYSMOD_COMMON }}
          ref: ${{ env.GARRYSMOD_COMMON_BRANCH }}
          path: garrysmod_common

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCESDK_MINIMAL }}
          ref: ${{ env.SOURCESDK_MINIMAL_BRANCH }}
          path: garrysmod_common/sourcesdk-minimal

      - uses: actions/checkout@v4
        with:
          repository: danielga/premake-export-compile-commands
          path: garrysmod_common/premake/premake-export-compile-commands

      - uses: actions/checkout@v4
        with:
          repository: danielga/detouring
          path: garrysmod_common/detouring
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: danielga/scanning
          path: garrysmod_common/scanning

      - name: Generate project
        run: premake5 --gmcommon=garrysmod_common ${{ matrix.premake_args }} gmake

      - name: Build
        working-directory: projects/linux/${{ matrix.workspace }}
        run: make -j"$(nproc)" config="$(echo "${CONFIG}_x86_64" | tr '[:upper:]' '[:lower:]')"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: projects/linux/${{ matrix.workspace }}/x86_64/${{ env.CONFIG }}/*.so
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip
        run: |
          mkdir out
          for dir in dist/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -9 "$GITHUB_WORKSPACE/out/$name.zip" *)
          done
          unzip -l 'out/*.zip'

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y.%m.%d).${GITHUB_SHA::7}"
          gh release create "$tag" out/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes
